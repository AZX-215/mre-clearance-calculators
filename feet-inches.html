<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feet & Inches Calculator</title>
<link rel="stylesheet" href="feet-inches.css" />
</head>
<body data-count="2">
<main class="page">
  <section class="topbar">
    <h1>Feet & Inches Calculator</h1>
    <div class="page-controls">
      <div class="count-control">
        <label for="calcCount">Calculators shown</label>
        <select id="calcCount">
          <option value="1">1 calculator</option>
          <option value="2" selected>2 calculators</option>
          <option value="3">3 calculators</option>
          <option value="4">4 calculators</option>
          <option value="5">5 calculators</option>
          <option value="6">6 calculators</option>
          <option value="7">7 calculators</option>
          <option value="8">8 calculators</option>
        </select>
      </div>
      <button class="secondary" id="clearAll" type="button">Clear all</button>
    </div>
  </section>

  <section class="grid" id="calculatorGrid" aria-label="Feet and inches calculators"></section>
</main>

<script src="feet-inches-core.js"></script>
<script src="feet-inches-app.js"></script>
</body>
</html>
